<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GoodFood Network · Preview</title>
<style>
:root{--green:#247a55;--ink:#20342a;--muted:#77847d;--canvas:#f5f7f4;--line:#e5ebe5;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1120px;margin:auto;min-height:100vh;padding:18px 26px 96px}.top{display:flex;align-items:center;gap:11px;margin-bottom:28px}.logo{width:42px;height:42px;border-radius:14px;background:#e3efe6;color:var(--green);display:grid;place-items:center;font-size:24px}.brand{font-weight:800;font-size:18px}.tagline{font-size:12px;color:var(--muted)}.rolebox{margin-left:auto;display:flex;align-items:center;gap:9px}.rolebox label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.09em}.rolebox select{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 30px 9px 12px;color:var(--ink);font-weight:700}.greeting h1{font-size:27px;margin:0 0 4px}.muted{color:var(--muted)}.hero{margin:22px 0 28px;border-radius:22px;background:var(--green);color:white;padding:22px 24px}.hero small{color:#d0e7d8}.hero strong{display:block;font-size:26px;margin:4px 0 13px}.stats{display:flex;gap:28px;color:#e2f0e6;font-size:12px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0}.text-btn{border:0;background:none;color:var(--green);font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(295px,1fr));gap:12px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.card-head{display:flex;gap:12px;align-items:flex-start}.food-icon{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:14px;background:#eaf2e8;font-size:24px}.card h3{margin:1px 0 2px;font-size:15px}.card .donor{font-size:12px;color:var(--muted)}.qty{margin-top:6px;font-size:12px;font-weight:700}.divider{height:1px;background:#edf0ed;margin:13px 0}.detail{font-size:11px;color:var(--muted);margin:5px 0}.actions{display:flex;justify-content:flex-end;margin-top:9px;gap:8px}.btn{border:0;border-radius:12px;background:var(--green);color:white;padding:10px 15px;font-size:13px;font-weight:700}.btn.secondary{background:#eaf2e8;color:var(--green)}.btn.outline{background:white;border:1px solid var(--line);color:var(--green)}.btn.danger{background:#fff0ed;color:#a94737}.fab{position:fixed;right:28px;bottom:88px;border:0;border-radius:30px;background:var(--green);color:white;padding:14px 20px;box-shadow:0 6px 20px #1b4b3433;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:4}.nav button{min-width:90px;border:0;border-radius:13px;background:transparent;color:var(--muted);padding:8px 12px;font-size:11px}.nav button.active{background:#eaf2e8;color:var(--green);font-weight:800}.nav .sym{display:block;font-size:18px;margin-bottom:2px}.search{display:flex;gap:9px;margin:16px 0 12px}.search input{flex:1}.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;color:var(--ink)}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:15px}.chip{border:1px solid var(--line);background:white;color:var(--muted);border-radius:20px;padding:7px 12px;font-size:12px;white-space:nowrap}.chip.active{background:#dceee1;color:var(--green);border-color:#dceee1;font-weight:700}.empty{color:var(--muted);text-align:center;padding:36px}.status{font-size:10px;border-radius:20px;padding:5px 9px;background:#eaf2e8;color:var(--green);font-weight:800;white-space:nowrap}.request-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.form{max-width:680px}.form label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.photo{border:1px dashed #b9cbbd;background:#edf4ed;border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form .submit{width:100%;margin-top:20px;padding:14px}.profile{display:flex;align-items:center;gap:12px;background:white;border-radius:17px;padding:18px;margin:16px 0}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#eaf2e8;color:var(--green);font-size:22px}.adminstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.adminstat{background:white;border-radius:16px;padding:15px}.adminstat strong{display:block;font-size:23px;margin:10px 0 3px}.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#20342a;color:white;padding:11px 18px;border-radius:12px;font-size:13px;z-index:8;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-back{position:fixed;inset:0;background:#17251d77;display:grid;place-items:center;padding:18px;z-index:9}.modal{background:white;border-radius:20px;padding:22px;width:min(100%,520px);max-height:90vh;overflow:auto}.modal h2{margin:0 0 8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.small{font-size:11px;color:var(--muted)}@media(max-width:600px){.app{padding:14px 16px 100px}.tagline{display:none}.rolebox label{display:none}.rolebox select{padding:8px 24px 8px 10px}.greeting h1{font-size:23px}.hero{padding:19px}.hero strong{font-size:23px}.nav{justify-content:space-around}.nav button{min-width:0;flex:1;padding:7px 5px}.fab{right:16px;bottom:82px}.grid2{grid-template-columns:1fr}}
.welcome{max-width:440px;min-height:100vh;margin:auto;padding:40px 24px;display:flex;flex-direction:column;justify-content:center}.welcome-logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;background:#e3efe6;color:var(--green);display:grid;place-items:center;font-size:40px}.welcome h1{text-align:center;margin:0;font-size:28px}.welcome>p{text-align:center;color:var(--muted);margin:7px 0 30px}.welcome h2{font-size:15px;margin:0 0 5px}.role-list{display:grid;gap:9px;margin:13px 0}.role-option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:white;border-radius:15px;padding:14px}.role-option.selected{border:2px solid var(--green);padding:13px}.role-icon{color:var(--green);font-size:22px}.role-copy{display:grid;gap:2px;flex:1}.role-copy strong{font-size:14px}.role-copy small{color:var(--muted);font-size:12px}.check{color:var(--green);font-weight:800}.continue{padding:13px}.demo-note{text-align:center;margin-top:13px}
</style></head>
<body><div id="root"></div><div id="toast" class="toast"></div><script>
const S={role:'Donor',screen:'welcome',tab:0,filter:'All',query:'',next:4,rid:1,donations:[
{id:1,name:'Fresh vegetable boxes',donor:'Green Basket Market',qty:12,unit:'boxes',category:'Produce',type:'Vegetarian',address:'12 Lake Road, Green Park',ready:'Today, 2:30 PM',deadline:'Today, 5:00 PM',notes:'Keep cool; packed in reusable crates.'},
{id:2,name:'Prepared lunch meals',donor:'Sunrise Community Kitchen',qty:25,unit:'meals',category:'Meals',type:'Vegetarian',address:'8 Market Street',ready:'Today, 3:00 PM',deadline:'Today, 4:30 PM',notes:'Contains dairy. Keep sealed.'},
{id:3,name:'Bakery bread & rolls',donor:'Cornerstone Bakery',qty:18,unit:'packs',category:'Bakery',type:'Vegetarian',address:'44 Central Avenue',ready:'Today, 4:15 PM',deadline:'Today, 7:00 PM',notes:'Packed this morning.'}],requests:[],ngos:{'Hope Shelter':true,'Sunrise Community Kitchen':true,'New Dawn Outreach':false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const foodIcon=c=>({Produce:'🥬',Meals:'🍲',Bakery:'🥖'})[c]||'🍱';const roleTabs={Donor:[['⌂','Home'],['▤','My food'],['♧','Requests'],['◉','Profile']],NGO:[['⌕','Explore'],['↗','My pickups'],['◉','Profile']],Admin:[['▦','Overview'],['✓','NGO review'],['⚑','Reports']]};
function notify(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}function reqFor(id){return S.requests.find(r=>r.donationId===id&&r.ngo==='Hope Shelter'&&r.stage==='Pending approval')}
function shell(content){const tabs=roleTabs[S.role],labels={Donor:'Food donor',NGO:'NGO / charity',Admin:'Platform admin'};document.querySelector('#root').innerHTML=`<div class="app"><header class="top"><div class="logo">♧</div><div><div class="brand">GoodFood Network</div><div class="tagline">Community food sharing</div></div><div class="rolebox"><label>DEMO ROLE</label><select onchange="switchRole(this.value)">${Object.keys(labels).map(r=>`<option value="${r}" ${r===S.role?'selected':''}>${labels[r]}</option>`)}</select></div></header>${content}</div><nav class="nav">${tabs.map((t,i)=>`<button class="${i===S.tab?'active':''}" onclick="go(${i})"><span class="sym">${t[0]}</span>${t[1]}</button>`).join('')}</nav>${S.role==='Donor'&&S.tab<2?'<button class="fab" onclick="showForm()">＋ Donate food</button>':''}`}
function switchRole(r){S.role=r;S.screen='app';S.tab=0;render()}function go(i){S.tab=i;render()}function card(d,role){const req=reqFor(d.id);return `<article class="card"><div class="card-head"><div class="food-icon">${foodIcon(d.category)}</div><div style="flex:1"><h3>${esc(d.name)}</h3><div class="donor">${esc(d.donor)}</div><div class="qty">${d.qty} ${esc(d.unit)} available · ${esc(d.type)}</div></div></div><div class="divider"></div><div class="detail">⌖ &nbsp;${esc(d.address)}</div><div class="detail">◷ &nbsp;Ready ${esc(d.ready)} · collect by ${esc(d.deadline)}</div>${d.notes?`<div class="detail">ⓘ &nbsp;${esc(d.notes)}</div>`:''}${role==='NGO'?(!S.ngos['Hope Shelter']?'<div class="detail">NGO verification is required before requesting food.</div>':req?'<div class="actions"><span class="status">Request sent · awaiting decision</span></div>':`<div class="actions"><button class="btn secondary" onclick="requestFood(${d.id})">Request food</button></div>`):''}</article>`}
function title(h,sub=''){return `<div class="greeting"><h1>${h}</h1>${sub?`<div class="muted">${sub}</div>`:''}</div>`}
function home(){const pending=S.requests.filter(r=>r.stage==='Pending approval').length;const delivered=S.requests.filter(r=>r.stage==='Delivered');const meals=delivered.reduce((a,r)=>a+r.qty,0);return `${title('Good afternoon 👋','Every donation helps feed a neighbor.')}<section class="hero"><small>Confirmed community impact</small><strong>${meals} meals shared</strong><div class="stats"><span>${delivered.length} completed donations</span><span>${pending} requests awaiting review</span></div></section><div class="section-head"><h2>Available food nearby</h2><button class="text-btn" onclick="go(1)">See all</button></div><div class="cards">${S.donations.filter(d=>d.qty>0).slice(0,3).map(d=>card(d,'Donor')).join('')||'<div class="empty">No active food listings yet.</div>'}</div>`}
function listingPage(){return `${title('My food listings','Manage surplus food and collection requests.')}<div class="section-head"><h2>All donations</h2><span class="status">${S.donations.length} listed</span></div><div class="cards">${S.donations.map(d=>card(d,'Donor')).join('')}</div>`}
function explore(){const list=S.donations.filter(d=>d.qty>0&&(S.filter==='All'||d.category===S.filter)&&`${d.name} ${d.donor} ${d.address}`.toLowerCase().includes(S.query.toLowerCase()));return `${title('Food near you','Choose food your organization can collect.')}<div class="search"><input class="input" placeholder="Search food, donor, or area" value="${esc(S.query)}" oninput="S.query=this.value;updateExploreCards()"></div><div class="chips">${['All','Produce','Meals','Bakery','Other'].map(c=>`<button class="chip ${S.filter===c?'active':''}" onclick="S.filter='${c}';render()">${c}</button>`).join('')}</div><div class="cards" id="exploreCards">${list.map(d=>card(d,'NGO')).join('')||'<div class="empty">No matching donations available.</div>'}</div>`}
function updateExploreCards(){const target=document.querySelector('#exploreCards');if(!target)return;const list=S.donations.filter(d=>d.qty>0&&(S.filter==='All'||d.category===S.filter)&&`${d.name} ${d.donor} ${d.address}`.toLowerCase().includes(S.query.toLowerCase()));target.innerHTML=list.map(d=>card(d,'NGO')).join('')||'<div class="empty">No matching donations available.</div>'}
function statusLabel(r){return r.stage}function requestCard(r,donor){const d=S.donations.find(x=>x.id===r.donationId);return `<article class="card"><div class="request-row"><h3>${esc(d?.name||'Food donation')}</h3><span class="status">${statusLabel(r)}</span></div><div class="detail">${esc(r.ngo)} requested ${r.qty} ${esc(d?.unit||'items')}</div>${d?`<div class="detail">Pickup: ${esc(d.address)}</div>`:''}${donor&&r.stage==='Pending approval'?`<div class="actions"><button class="btn outline" onclick="decide(${r.id},false)">Reject</button><button class="btn" onclick="decide(${r.id},true)">Approve</button></div>`:''}${!donor&&(r.stage==='Approved'||r.stage==='Collected')?`<div class="actions"><button class="btn secondary" onclick="advance(${r.id})">${r.stage==='Approved'?'Confirm collection':'Confirm delivery'}</button></div>`:''}</article>`}
function donorRequests(){return `${title('Donation requests','Approve or reject NGO collection requests.')}<div class="cards">${S.requests.map(r=>requestCard(r,true)).join('')||'<div class="empty">New NGO requests will appear here.</div>'}</div>`}
function ngoPickups(){return `${title('My pickups','Requests and delivery progress for Hope Shelter.')}<div class="cards">${S.requests.filter(r=>r.ngo==='Hope Shelter').map(r=>requestCard(r,false)).join('')||'<div class="empty">You have not requested a donation yet.</div>'}</div>`}
function adminOverview(){const delivered=S.requests.filter(r=>r.stage==='Delivered').reduce((a,r)=>a+r.qty,0);return `${title('Platform overview','Community activity at a glance.')}<div class="adminstats">${[['Available food',S.donations.filter(d=>d.qty>0).length,'🍲'],['Verified NGOs',Object.values(S.ngos).filter(Boolean).length,'✓'],['Completed pickups',S.requests.filter(r=>r.stage==='Delivered').length,'↗'],['Meals delivered',delivered,'♧']].map(([a,b,c])=>`<div class="adminstat"><span>${c}</span><strong>${b}</strong><span class="muted">${a}</span></div>`).join('')}</div><div class="section-head"><h2>Recent donations</h2></div><div class="cards">${S.donations.slice(0,4).map(d=>card(d,'Admin')).join('')}</div>`}
function verifyPage(){return `${title('NGO verification','Review organizations before they collect food.')}<div class="cards">${Object.entries(S.ngos).map(([name,verified])=>`<article class="card"><div class="request-row"><h3>${esc(name)}</h3><span class="status">${verified?'Verified':'Needs review'}</span></div><div class="detail">Registration details · organization contact · distribution area</div><div class="actions"><button class="btn ${verified?'outline':'secondary'}" onclick="verify('${esc(name)}',${!verified})">${verified?'Revoke verification':'Mark verified'}</button></div></article>`).join('')}</div>`}
function profile(){return `${title('Organization profile')}<div class="profile"><div class="avatar">◉</div><div><strong>Hope Shelter</strong><div class="small">Community organization</div></div><span class="status">Verified</span></div>${['Organization details','Service area and pickup location','Notifications','Food handling guidance'].map(x=>`<article class="card" style="margin-bottom:8px">♧ &nbsp; ${x} <span style="float:right;color:#77847d">›</span></article>`).join('')}<p class="small" style="text-align:center;margin-top:20px">Demo profile · changes are not saved after closing the browser</p>`}
function welcome(){const options={Donor:['Donate food','I have surplus food to share.','♧'],NGO:['Find food for my NGO','Request food and confirm deliveries.','♙']};document.querySelector('#root').innerHTML=`<main class="welcome"><div class="welcome-logo">♧</div><h1>GoodFood Network</h1><p>Rescue good food. Share it with your community.</p><h2>How will you use GoodFood?</h2><div class="small">Choose the option that fits you.</div><div class="role-list">${Object.entries(options).map(([r,[heading,description,icon]])=>`<button class="role-option ${S.role===r?'selected':''}" onclick="S.role='${r}';render()"><span class="role-icon">${icon}</span><span class="role-copy"><strong>${heading}</strong><small>${description}</small></span>${S.role===r?'<span class="check">✓</span>':''}</button>`).join('')}</div><button class="btn continue" onclick="S.screen='app';S.tab=0;render()">Continue as ${options[S.role][0]}</button><div class="small demo-note">Demo access · no account needed</div><div style="text-align:center;margin-top:5px"><button class="text-btn" onclick="switchRole('Admin')">Admin login</button></div></main>`}
function render(){if(S.screen==='welcome'){welcome();return}let content;if(S.role==='Donor')content=[home,listingPage,donorRequests,profile][S.tab]();else if(S.role==='NGO')content=[explore,ngoPickups,profile][S.tab]();else content=[adminOverview,verifyPage,()=>`${title('Reports & activity','Request and donation history.')}<div class="cards">${S.requests.map(r=>requestCard(r,false)).join('')||'<div class="empty">No reports in this demo yet.</div>'}</div>`][S.tab]();shell(content)}
function showForm(){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal" onclick="if(event.target===this)this.remove()"><form class="modal form" onsubmit="publish(event)"><h2>Share surplus food</h2><div class="muted">Help an NGO plan a safe collection. Please provide accurate food and timing details.</div><div class="photo" style="margin-top:15px">＋ &nbsp; Food photo · image storage can be connected later</div><label>Food name</label><input class="input" name="name" required placeholder="Fresh vegetable boxes"><div class="grid2"><div><label>Category</label><select name="category"><option>Meals</option><option>Produce</option><option>Bakery</option><option>Other</option></select></div><div><label>Food type</label><select name="type"><option>Vegetarian</option><option>Non-vegetarian</option><option>Vegan</option><option>Other</option></select></div></div><div class="grid2"><div><label>Quantity</label><input class="input" name="qty" type="number" min="1" required placeholder="20"></div><div><label>Unit</label><input class="input" name="unit" required value="meals"></div></div><label>Pickup address</label><input class="input" name="address" required placeholder="Street, area, city"><div class="grid2"><div><label>Ready time</label><input class="input" name="ready" type="time"></div><div><label>Safe collection deadline</label><input class="input" name="deadline" type="time"></div></div><label>Storage and allergen notes</label><textarea class="input" name="notes" rows="2" placeholder="Contains dairy; keep refrigerated, etc."></textarea><p class="small">Only list food that is safe to distribute. This app does not certify food safety.</p><div class="modal-actions"><button type="button" class="btn outline" onclick="document.querySelector('#modal').remove()">Cancel</button><button class="btn">Publish donation</button></div></form></div>`)}
function publish(e){e.preventDefault();const f=new FormData(e.target),fmt=v=>v?new Date(`2000-01-01T${v}`).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Not specified';S.donations.unshift({id:S.next++,name:f.get('name'),donor:'Your organization',qty:+f.get('qty'),unit:f.get('unit'),category:f.get('category'),type:f.get('type'),address:f.get('address'),ready:fmt(f.get('ready')),deadline:fmt(f.get('deadline')),notes:f.get('notes')});document.querySelector('#modal').remove();notify('Donation published.');render()}
function requestFood(id){const d=S.donations.find(x=>x.id===id);const value=prompt(`How many ${d.unit} would you like to request? Available: ${d.qty}`,d.qty);if(value===null)return;const qty=Number(value);if(!Number.isInteger(qty)||qty<1||qty>d.qty){notify('Enter a valid quantity.');return}S.requests.unshift({id:S.rid++,donationId:id,ngo:'Hope Shelter',qty,stage:'Pending approval'});notify('Request sent to donor.');render()}
function decide(id,accept){const r=S.requests.find(x=>x.id===id),d=S.donations.find(x=>x.id===r.donationId);if(accept&&r.qty>d.qty){notify('Not enough food remains for this request.');return}r.stage=accept?'Approved':'Rejected';if(accept){d.qty-=r.qty;notify(d.qty?`Approved. ${d.qty} ${d.unit} remain available.`:'Approved; all food is reserved.')}else notify('Request rejected.');render()}
function advance(id){const r=S.requests.find(x=>x.id===id);r.stage=r.stage==='Approved'?'Collected':'Delivered';notify(`Status updated: ${r.stage}.`);render()}
function verify(name,value){S.ngos[name]=value;notify(value?'NGO marked verified.':'Verification revoked.');render()}render();
</script></body></html>
